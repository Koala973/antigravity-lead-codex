name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Tag & Version Consistency
        run: node scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Privacy & Secret Scan
        run: bash scripts/privacy-check.sh

      - name: Syntax Check, Build UI & Verify Dist Sync
        run: |
          bash -n scripts/install.sh
          bash -n scripts/doctor.sh
          bash -n scripts/package-release.sh
          bash -n scripts/privacy-check.sh
          bash -n plugins/codex-console/bin/run-server.sh
          python3 -m py_compile skills/multi-agent-dispatch/scripts/dispatch.py
          python3 -m py_compile plugins/codex-auto-router/hooks/allow_dispatch.py
          for f in plugins/codex-console/server/*.mjs scripts/*.mjs tests/*.mjs; do
            node --check "$f"
          done
          (cd plugins/codex-console && npm ci --no-audit --no-fund && npm run build:ui)
          git diff --exit-code -- plugins/codex-console/dist/

      - name: Run Full Test Suite Before Packaging
        run: |
          node --no-warnings tests/test-wave1-guards.mjs
          node --no-warnings tests/test-mcp-console.mjs
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Package Prebuilt UI Release Tarball
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME}" release-artifacts --skip-checksums

      - name: Verify Unpacked Tarball (--no-build Install, Doctor & MCP Handshake)
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          EXTRACT_DIR="$(mktemp -d)"
          TMP_CFG="$(mktemp -d)"
          TMP_CODEX="$(mktemp -d)"
          trap 'rm -rf "$EXTRACT_DIR" "$TMP_CFG" "$TMP_CODEX"' EXIT

          tar -xzf "release-artifacts/antigravity-lead-codex-${GITHUB_REF_NAME}.tar.gz" -C "$EXTRACT_DIR"
          UNPACKED="$EXTRACT_DIR/antigravity-lead-codex-${GITHUB_REF_NAME}"

          GEMINI_CONFIG_DIR="$TMP_CFG" CODEX_HOME="$TMP_CODEX" bash "$UNPACKED/scripts/install.sh" --no-build --yes
          GEMINI_CONFIG_DIR="$TMP_CFG" CODEX_HOME="$TMP_CODEX" bash "$UNPACKED/scripts/doctor.sh"
          node --no-warnings "$UNPACKED/scripts/verify-mcp-handshake.mjs" \
            "$TMP_CFG/plugins/codex-console/bin/run-server.sh" \
            --expected-version "$EXPECTED_VERSION"

      - name: Generate SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          sha256sum "antigravity-lead-codex-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS.txt
